<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lưu trữ tin nóng</title><style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e6edf3;
     font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 20px 14px;border-bottom:1px solid #1e242c;position:sticky;
       top:0;background:#0b0f14;z-index:20}
h1{margin:0 0 4px;font-size:21px}
.sub{color:#7d8590;font-size:12.5px}
.stats{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#adbac7}
.stats b{color:#58a6ff}
.bar{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;align-items:center}
.bar .lb{font-size:11px;color:#6e7681;text-transform:uppercase;letter-spacing:.6px;
         margin-right:2px;min-width:52px}
.btn{border:1px solid #30363d;background:#151b23;color:#adbac7;font-size:12.5px;
     padding:5px 12px;border-radius:16px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:#58a6ff;color:#e6edf3}
.btn.on{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
#q{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:16px;
   padding:6px 13px;font-size:12.5px;font-family:inherit;min-width:210px}
#q:focus{outline:none;border-color:#58a6ff}
main{padding:14px 20px 70px;max-width:1060px;margin:0 auto}
.card{display:flex;gap:13px;padding:13px;border:1px solid #1e242c;border-radius:10px;
      margin-bottom:9px;background:#111820}
.thumb{width:104px;height:104px;border-radius:8px;object-fit:cover;flex:0 0 auto;
       background:#0d1117;border:1px solid #1e242c}
.thumb.v{height:78px;width:138px}
.thumbwrap{position:relative;display:block;flex:0 0 auto;line-height:0}
.nimg{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.78);color:#fff;
      font:700 10.5px/1 monospace;padding:3px 5px;border-radius:5px;pointer-events:none}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:999;
    align-items:center;justify-content:center;flex-direction:column;gap:10px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:82vh;border-radius:8px;object-fit:contain}
#lb .nav{display:flex;gap:14px;align-items:center;color:#e6edf3;font-size:13px}
#lb button{background:#1f6feb;border:0;color:#fff;font-size:15px;padding:8px 18px;
           border-radius:18px;cursor:pointer;font-family:inherit}
#lb .x{position:absolute;top:16px;right:22px;font-size:30px;color:#fff;cursor:pointer;
       background:none;border:0;padding:0}
@media(max-width:560px){.thumb{width:74px;height:74px}.thumb.v{width:98px;height:56px}}
.card.so{border-color:#6e40c9;background:#160f26}
.rank{font:700 18px/1 monospace;color:#3d444d;min-width:40px;text-align:right;padding-top:3px}
.card.so .rank{color:#a371f7}
.body{flex:1;min-width:0}
.top{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.sc{font:700 11.5px/1 monospace;color:#0b0f14;background:#3fb950;padding:4px 7px;border-radius:5px}
.card.so .sc{background:#a371f7}
.p{display:inline-block;color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;
   border-radius:4px;letter-spacing:.3px;text-transform:uppercase}
.p.cat{background:#1f6feb}
.p.cat.cops{background:#bf6a02}
.p.so{background:#8957e5}
.p.nw{background:#238636}
.p.md{background:#30363d}
.tt{font-size:15.5px;font-weight:600;margin-bottom:5px;line-height:1.4}
.tt a{color:#e6edf3;text-decoration:none}
.tt a:hover{color:#58a6ff}
.meta{color:#7d8590;font-size:12px;margin-bottom:2px}
.au{color:#6e7681;font-size:11.5px;margin-top:3px}
.also{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:#7d8590}
.also a{color:#9db4c0;text-decoration:none}
.also a:hover{color:#58a6ff}
.also i{font-style:normal;color:#3d444d;font-size:11px}
.nd{margin-top:6px;font-size:11.5px;color:#3fb950}
.hide{display:none}
.empty{color:#6e7681;padding:40px 0;text-align:center}
.legend{margin-top:9px;font-size:11.5px;color:#6e7681}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;
             vertical-align:-1px;margin:0 4px 0 12px}

body{max-width:640px;margin:0 auto}
ul{list-style:none;padding:0}li{padding:10px 0;border-bottom:1px solid #1e242c}
a{color:#58a6ff;text-decoration:none;font-size:16px}
a:hover{text-decoration:underline}</style></head><body>
